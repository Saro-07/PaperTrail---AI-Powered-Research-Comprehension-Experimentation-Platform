services:
  # Backend FastAPI Service
  - type: web
    name: papertrail-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: papertrail-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false

  # Frontend React Static Site
  - type: web
    name: papertrail-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: papertrail-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: papertrail-backend
          property: host
